<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>noVNC</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #screen {
            width: 100%;
            height: 100%;
            border: none;
        }
        #password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #password-form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        #password-form h2 {
            margin: 0 0 20px 0;
            color: #333;
        }
        #password-form input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        #password-form button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #password-form button:hover {
            background: #0056b3;
        }
        #status {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
        .error {
            color: #dc3545;
        }
        .success {
            color: #28a745;
        }
    </style>
</head>
<body>
    <div id="screen"></div>
    
    <!-- Password Input Overlay -->
    <div id="password-overlay">
        <div id="password-form">
            <h2>VNC 连接</h2>
            <p>请输入VNC密码以连接到桌面</p>
            <input type="password" id="vnc-password" placeholder="输入VNC密码" autocomplete="off">
            <button onclick="connectVNC()">连接</button>
            <div id="status"></div>
        </div>
    </div>

    <script type="module">
        import RFB from './core/rfb.js';
        
        let rfb = null;
        let connectionAttempted = false;
        
        // Dynamic WebSocket URL resolution for subdomain support
        function getWebSocketURL() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host;
            const path = window.location.pathname.replace(/\/$/, '');
            
            // Use current host for WebSocket connection (works for both localhost and subdomain)
            return `${protocol}//${host}${path}/websockify`;
        }
        
        // Check for password in URL parameters
        function getPasswordFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('password');
        }
        
        // Initialize VNC connection
        function initVNC(password) {
            if (rfb) {
                rfb.disconnect();
                rfb = null;
            }
            
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '正在连接到VNC服务器...';
            statusDiv.className = '';
            
            rfb = new RFB(document.getElementById('screen'), getWebSocketURL(), {
                credentials: { password: password },
                wsProtocols: ['binary']
            });

            rfb.addEventListener('connect', () => {
                console.log('Connected to VNC server');
                document.getElementById('password-overlay').style.display = 'none';
                statusDiv.innerHTML = '连接成功！';
                statusDiv.className = 'success';
            });

            rfb.addEventListener('disconnect', (e) => {
                console.log('Disconnected from VNC server:', e.detail.clean ? 'clean' : 'dirty');
                if (!e.detail.clean) {
                    document.getElementById('password-overlay').style.display = 'flex';
                    statusDiv.innerHTML = '连接断开，请重新输入密码';
                    statusDiv.className = 'error';
                }
            });

            rfb.addEventListener('credentialsrequired', () => {
                console.log('Credentials required');
                document.getElementById('password-overlay').style.display = 'flex';
                statusDiv.innerHTML = '需要输入密码';
                statusDiv.className = 'error';
            });

            rfb.addEventListener('securityfailure', (e) => {
                console.log('Security failure:', e.detail.reason);
                document.getElementById('password-overlay').style.display = 'flex';
                statusDiv.innerHTML = '密码验证失败，请检查密码';
                statusDiv.className = 'error';
            });

            rfb.addEventListener('clipboard', (e) => {
                console.log('Clipboard event:', e.detail.text);
            });

            rfb.addEventListener('bell', () => {
                console.log('Bell event');
            });

            rfb.addEventListener('desktopname', (e) => {
                console.log('Desktop name:', e.detail.name);
            });

            rfb.addEventListener('capabilities', (e) => {
                console.log('Capabilities:', e.detail.capabilities);
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                if (rfb) {
                    rfb.scaleViewport = true;
                    rfb.resizeSession = true;
                }
            });
        }
        
        // Global function for password form
        window.connectVNC = function() {
            const password = document.getElementById('vnc-password').value;
            if (password.trim() === '') {
                document.getElementById('status').innerHTML = '请输入密码';
                document.getElementById('status').className = 'error';
                return;
            }
            initVNC(password);
        };
        
        // Handle Enter key in password field
        document.getElementById('vnc-password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                connectVNC();
            }
        });

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Check if password is provided in URL
            const urlPassword = getPasswordFromURL();
            if (urlPassword) {
                document.getElementById('vnc-password').value = urlPassword;
                initVNC(urlPassword);
            }
        });
    </script>
</body>
</html>
