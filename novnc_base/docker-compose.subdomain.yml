version: '3.8'

services:
  vnc-base:
    build: .
    container_name: vnc-base-subdomain
    restart: unless-stopped
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:5900:5900"
    environment:
      - VNC_PASSWORD=${VNC_PASSWORD:-vnc123}
    volumes:
      - vnc-data:/home/shared
    networks:
      - vnc-network

  nginx-proxy:
    image: nginx:alpine
    container_name: vnc-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-subdomain.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - vnc-base
    networks:
      - vnc-network

  # Optional: Let's Encrypt for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: vnc-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot-www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email your-email@example.com --agree-tos --no-eff-email -d vnc.yourdomain.com
    depends_on:
      - nginx-proxy
    networks:
      - vnc-network

volumes:
  vnc-data:
  nginx-logs:

networks:
  vnc-network:
    driver: bridge 